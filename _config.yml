# Site wide configuration

title: Dan Flynn | Data Science
locale: en_US
description: Energy, Environment, and Sustainability Science for Transportation, Land Use Planning, and Conservation
logo: df-logo2.png
search: true
#url: http://flynnd.io 

# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-remote-theme 
  - jekyll-sitemap
  - jekyll-gist
remote_theme: pages-themes/cayman@v0.2.0

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..2
  enable_coderay: false

mathjax: true

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", ".less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "vendor"]


# Site owner
owner:
  name: Dan Flynn
  avatar: bio-photo.jpg
  email: dan@flynnd.io
  github: flynn-d
  linkedin: dan-flynn-068b3561
  google:
    plus: #username
